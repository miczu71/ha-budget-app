# Zasady:
# - wyłącznie sieci ogólnopolskie i marki międzynarodowe; lokalne firmy to reguły użytkownika
#   w bazie add-onu, nigdy ten plik (repo jest publiczne);
# - wzorzec to ciąg całych słów po normalizacji (wielkie litery, bez polskich znaków, znaki
#   inne niż litery i cyfry rozdzielają słowa): „MCDONALD'S” = słowa MCDONALD + S;
# - wygrywa najdłuższy pasujący wzorzec (więcej słów), potem kolejność w pliku;
# - [brands.*] nadaje nazwę sprzedawcy (klucz), [keywords] tylko kategorię.
#
