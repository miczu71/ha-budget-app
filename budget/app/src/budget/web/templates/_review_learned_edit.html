{# Rozwinięta grupa „przypisane automatycznie”: pozycje i zmiana kategorii (g, month, tree) #}
{% from "_macros.html" import category_options %}
<form class="rv-actions" hx-post="{{ base }}/review/learned" hx-target="#rv-learned" hx-swap="outerHTML" hx-disabled-elt="find button">
  <input type="hidden" name="merchant" value="{{ g.key.merchant }}"><input type="hidden" name="currency" value="{{ g.key.currency }}">
  <input type="hidden" name="cat" value="{{ g.key.category_id }}"><input type="hidden" name="direction" value="{{ g.key.direction }}">
  <input type="hidden" name="month" value="{{ month.strftime('%Y-%m') if month else '' }}">
  <select name="category_id" aria-label="kategoria">{{ category_options(tree, g.key.category_id) }}</select>
  <button type="submit">Zapisz</button>
</form>
<ul class="rv-items">
  {% for i in g.items %}
  <li>
    <span><span class="date small muted">{{ i.day | pldate }}</span>
      <span class="rv-desc">{{ i.description or i.merchant }}</span></span>
    <span class="num {{ 'neg' if i.amount < 0 else 'pos' }}">{{ i.amount | money(i.currency) }}</span>
  </li>
  {% endfor %}
</ul>
