name: "Budżet Domowy"
version: "0.17.0"
slug: budget
description: "Budżet domowy z automatycznym pobieraniem transakcji z banku (PSD2 / Enable Banking)"
url: "https://github.com/miczu71/ha-budget-app"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:wallet
panel_title: "Budżet"
panel_admin: true
homeassistant_api: true
services:
  - mqtt:need
map:
  - type: addon_config
    read_only: false
options:
  eb_application_id: ""
  eb_private_key_file: "enablebanking.pem"
  eb_redirect_url: ""
  aspsp_name: "Bank Millennium"
  aspsp_country: "PL"
  sync_times: ["06:30", "13:30", "21:30"]
  notify_service: ""
  consent_warning_days: 14
  currency: "PLN"
  month_start_day: 1
  ai_base_url: ""
  ai_api_key: ""
  ai_model: "gemini-3.1-flash-lite"
  ai_daily_calls: 20
  log_level: info
schema:
  eb_application_id: str?
  eb_private_key_file: str
  eb_redirect_url: str?
  aspsp_name: str
  aspsp_country: "match(^[A-Z]{2}$)"
  sync_times: ["match(^([01]\\d|2[0-3]):[0-5]\\d$)"]
  notify_service: "match(^(notify\\.[a-z0-9_]+)?$)?"
  consent_warning_days: "int(1,60)"
  currency: str
  month_start_day: "int(1,28)"
  ai_base_url: "match(^(https?://\\S+)?$)?"
  ai_api_key: password?
  ai_model: str?
  ai_daily_calls: "int(0,500)"
  log_level: "list(debug|info|warning|error)"
