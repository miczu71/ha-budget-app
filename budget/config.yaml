# Szkic wg SPEC §3.3 — add-on nie jest jeszcze instalowalny (Dockerfile i run.sh w M8).
name: "Budżet Domowy"
version: "0.0.1"
slug: budget
description: "Budżet domowy z automatycznym pobieraniem transakcji z banku (PSD2 / Enable Banking)"
url: "https://github.com/miczu71/ha-budget-app"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:wallet
panel_title: "Budżet"
homeassistant_api: true
services:
  - mqtt:want
map:
  - type: addon_config
    read_only: false
options:
  eb_application_id: null
  eb_private_key_file: "enablebanking.pem"
  eb_redirect_url: null
  sync_times: ["06:30", "13:30", "21:30"]
  currency: "PLN"
  month_start_day: 1
  consent_warning_days: 14
  log_level: info
schema:
  eb_application_id: str
  eb_private_key_file: str
  eb_redirect_url: url
  sync_times: ["match(^([01]\\d|2[0-3]):[0-5]\\d$)"]
  currency: str
  month_start_day: "int(1,28)"
  consent_warning_days: "int(1,60)"
  log_level: "list(debug|info|warning|error)"
