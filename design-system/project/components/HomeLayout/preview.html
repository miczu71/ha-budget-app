<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:var(--canvas)}main{padding:16px}</style></head>
<body>
<main>
<section class="card" id="layout">
  <h2>Układ strony</h2>
  <p class="small muted">Przestaw kafelki strzałkami albo ukryj te, których nie potrzebujesz. Układ jest wspólny dla wszystkich urządzeń.</p>
  <ul class="layout-list">
    <li class="layout-row"><span class="layout-name">Do wypłaty</span>
      <button type="button" class="secondary layout-btn" aria-label="Wyżej: Do wypłaty" disabled><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      <button type="button" class="secondary layout-btn" aria-label="Niżej: Do wypłaty"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m7-7-7 7-7-7"/></svg></button>
      <button type="button" class="secondary layout-btn" aria-label="Ukryj: Do wypłaty"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg></button></li>
    <li class="layout-row off"><span class="layout-name">Karta kredytowa <span class="small muted">(ukryty)</span></span>
      <button type="button" class="secondary layout-btn" aria-label="Wyżej: Karta kredytowa"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      <button type="button" class="secondary layout-btn" aria-label="Niżej: Karta kredytowa" disabled><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m7-7-7 7-7-7"/></svg></button>
      <button type="button" class="secondary layout-btn" aria-label="Pokaż: Karta kredytowa"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49M14.084 14.158a3 3 0 0 1-4.242-4.242M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143M2 2l20 20"/></svg></button></li>
  </ul>
  <div class="layout-foot"><button type="button" class="secondary tap">Przywróć domyślny</button><a class="button tap" href="#">Gotowe</a></div>
</section>
</main>
</body></html>
